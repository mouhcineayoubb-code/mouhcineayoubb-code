name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # tkhdem kola nhar f minuit
  workflow_dispatch: {} # bach tqder tchghlha b yeddik manuellement mn tab Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from a github contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: mouhcineayoubb-code
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
